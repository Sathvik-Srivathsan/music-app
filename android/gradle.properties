# Tuned for this low-RAM machine (5.8 GB total). The Flutter default of -Xmx8G
# lets the Gradle daemon request more than the OS can give, so it gets killed
# mid-build ("Gradle build daemon disappeared unexpectedly"). Keep the heap
# modest so release builds complete reliably.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
